<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>West-Vlaamse Monopoly Online</title><style>*{box-sizing:border-box}body{background:#0d2134;color:white;font:16px system-ui;margin:0;padding:12px}main{max-width:750px;margin:auto}h1{color:#ffd166;font-size:clamp(23px,6vw,36px)}.panel{background:#1e3b56;border-radius:12px;padding:15px;margin:12px 0}input{padding:12px;border-radius:8px;border:0;max-width:100%;margin:5px}button{background:#ffd166;color:#172234;border:0;border-radius:8px;padding:12px;font-weight:700;margin:4px;min-height:44px}button:disabled{opacity:.35}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));aspect-ratio:1;gap:3px}.tile{background:#f7f8fa;color:#142034;border-top:5px solid #e5a74e;border-radius:5px;padding:2px;font-size:clamp(7px,2vw,13px);overflow:hidden;overflow-wrap:anywhere}.center{grid-column:2/5;grid-row:2/5;display:grid;place-content:center;text-align:center;background:#1e3b56;padding:4px;border-radius:6px}.center h2{font-size:clamp(16px,4vw,28px)}.person{background:#10283e;padding:9px;border-radius:8px;margin:5px 0}.active{outline:2px solid #ffd166}#events{max-height:180px;overflow:auto}small{display:block}.hint{opacity:.8;font-size:13px}#error{color:#ffadad}</style><main><h1>🎲 West-Vlaamse Monopoly</h1><p>V6 • Online spelen met 2–6 vrienden op verschillende toestellen</p><section id="lobby" class="panel"><h2>Online spelkamer</h2><input id="name" placeholder="Jouw spelersnaam" maxlength="20"><p><button onclick="createRoom()">Maak kamer</button></p><input id="codeInput" placeholder="Kamercode" maxlength="6"><button onclick="joinRoom()">Sluit aan</button><p id="error"></p></section><section id="game" hidden><div class="panel"><h2 id="room"></h2><p class="hint">Deel de kamercode met je vrienden. Spelkamers blijven alleen bestaan zolang de server draait.</p><button onclick="share()">📋 Kopieer uitnodiging</button><div id="players"></div><p id="turn"></p><button id="start" onclick="action('start')">▶️ Start spel</button><button id="roll" onclick="action('roll')">🎲 Gooien</button><button id="buy" onclick="action('buy')">🏠 Koop</button><button id="build" onclick="action('build')">🔨 Bouw</button><button id="end" onclick="action('end')">Volgende beurt</button><p id="message"></p></div><div id="board" class="board"></div><div class="panel"><h3>Spelverloop</h3><div id="events"></div></div></section></main><script>
const names=['START','Kortrijk','Waregem','Roeselare','GEVANGENIS','Ieper','Brugge','Oostende','Knokke','GRATIS PARKEREN','Diksmuide','Menen','Tielt','Poperinge','GA NAAR GEVANGENIS','De Panne'],special=new Set([0,4,9,14]);let code='',id='',state=null,seat=-1;
const el=x=>document.getElementById(x),price=i=>100+i*25,esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
async function api(path,data){const r=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'Er ging iets mis');return j}
async function createRoom(){try{const r=await api('create',{name:el('name').value});connect(r)}catch(e){el('error').textContent=e.message}}
async function joinRoom(){try{const r=await api('join',{name:el('name').value,code:el('codeInput').value});connect(r)}catch(e){el('error').textContent=e.message}}
function connect(r){code=r.code;id=r.id;seat=r.state.players.length-1;el('lobby').hidden=true;el('game').hidden=false;history.replaceState({},'',location.pathname+'?room='+code);render(r.state);setInterval(refresh,2000)}
async function refresh(){if(!code)return;try{const r=await fetch('/api/state?code='+encodeURIComponent(code),{cache:'no-store'});if(r.ok)render(await r.json());else el('message').textContent='Verbinding met spelkamer verloren'}catch(e){el('message').textContent='Verbinding wordt hersteld...'}}
async function action(type){try{const r=await api('action',{code,id,action:type});el('message').textContent='';render(r.state)}catch(e){el('message').textContent=e.message}}
function share(){const txt='Speel West-Vlaamse Monopoly mee! '+location.origin+'/?room='+code+' • Kamercode: '+code;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>el('message').textContent='Uitnodiging gekopieerd').catch(()=>el('message').textContent=txt);else el('message').textContent=txt}
function render(s){state=s;el('room').textContent='Kamer: '+s.code;const myIndex=seat;const myTurn=seat===s.turn;
el('players').innerHTML=s.players.map((p,i)=>'<div class="person '+(i===s.turn&&s.started?'active':'')+'">'+['🔴','🔵','🟢','🟣','🟠','⚪'][i]+' <b>'+esc(p.name)+'</b> • '+(p.bankrupt?'Failliet':'€'+p.cash)+'</div>').join('');
el('turn').textContent=s.winner?'🏆 Winnaar: '+s.winner:s.started?'Aan de beurt: '+s.players[s.turn].name:'Wachten op minstens 2 spelers';
el('start').hidden=s.started;el('start').disabled=s.players.length<2||myIndex!==0;for(const x of ['roll','buy','build','end'])el(x).hidden=!s.started;
const p=s.players[s.turn],i=p.pos;el('roll').disabled=!myTurn||s.phase!=='roll'||!!s.winner;el('buy').disabled=!myTurn||s.phase!=='action'||special.has(i)||s.owners[i]!==undefined||p.cash<price(i)||!!s.winner;el('build').disabled=!myTurn||s.phase!=='action'||s.owners[i]!==s.turn||(s.houses[i]||0)>=5||p.cash<Math.round(price(i)/2)||!!s.winner;el('end').disabled=!myTurn||s.phase!=='action'||!!s.winner;
el('events').innerHTML=s.log.slice().reverse().map(x=>'<p>'+esc(x)+'</p>').join('');
el('board').innerHTML='';names.forEach((n,i)=>{const t=document.createElement('div');t.className='tile';t.style.gridColumn=i<5?i+1:i<9?5:i<13?13-i:1;t.style.gridRow=i<5?1:i<9?i-3:i<13?5:17-i;t.innerHTML='<b>'+esc(n)+'</b><small>'+(special.has(i)?'':'€'+price(i))+'</small><small>'+(s.houses[i]===5?'🏨':s.houses[i]?'🏠×'+s.houses[i]:'')+'</small><small>'+(s.owners[i]!==undefined?'👑 '+esc(s.players[s.owners[i]].name):'')+'</small>'+s.players.map((p,k)=>p.pos===i?['🔴','🔵','🟢','🟣','🟠','⚪'][k]:'').join('');el('board').appendChild(t)});const mid=document.createElement('div');mid.className='center';mid.innerHTML='<h2>WEST-VLAAMSE<br>MONOPOLY</h2><p>🌍 ONLINE V6</p>';el('board').appendChild(mid)}
const requested=new URLSearchParams(location.search).get('room');if(requested)el('codeInput').value=requested;
</script></html>
