<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>West-Vlaamse Monopoly</title><style>body{font:16px system-ui;background:#102238;color:white;margin:0;padding:15px}main{max-width:850px;margin:auto}h1{color:#ffd166}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.cell{background:#f4f5f8;color:#172337;border-radius:7px;min-height:75px;padding:6px;font-size:12px;border-top:9px solid #e4a54c}.cell b{display:block}.center{grid-column:2/5;grid-row:2/5;display:grid;place-content:center;text-align:center;background:#1c3853;border-radius:8px}button{padding:12px;border:0;border-radius:8px;background:#ffd166;margin:4px;font-weight:700}button:disabled{opacity:.4}.panel{background:#1c3853;border-radius:10px;padding:14px;margin:12px 0}input{padding:8px;width:100px;margin:3px}#log{max-height:180px;overflow:auto}small{display:block}</style><main><h1>🎲 West-Vlaamse Monopoly</h1><p>Testversie: 2 tot 4 spelers op één toestel</p><div id="setup" class="panel">Spelers: <select id="count" onchange="names()"><option>2</option><option>3</option><option>4</option></select><div id="names"></div><button onclick="start()">Start spel</button></div><div id="game" hidden><div class="panel"><b id="turn"></b><p id="money"></p><button id="roll" onclick="roll()">🎲 Gooien</button><button id="buy" onclick="buy()">🏠 Kopen</button><button id="next" onclick="next()">Volgende beurt</button></div></div><div class="board" id="board"></div><div class="panel" id="log">Welkom!</div></main><script>
const locations=['START','Kortrijk','Waregem','Roeselare','GEVANGENIS','Ieper','Brugge','Oostende','Knokke','GRATIS PARKEREN','Diksmuide','Menen','Tielt','Poperinge','GA NAAR GEVANGENIS','De Panne'];
let ps=[],turn=0,done=false,owners={},canBuy=false;function names(){document.getElementById('names').innerHTML=Array.from({length:+document.getElementById('count').value},(_,i)=>'<input id="p'+i+'" value="Speler '+(i+1)+'">').join('')}names();function price(i){return 100+i*25}function log(s){document.getElementById('log').innerHTML='<p>'+s+'</p>'+document.getElementById('log').innerHTML}function draw(){let b=document.getElementById('board');b.innerHTML='';locations.forEach((n,i)=>{let c=document.createElement('div');c.className='cell';c.style.gridColumn=i<5?i+1:i<9?5:i<13?13-i:1;c.style.gridRow=i<5?1:i<9?i-3:i<13?5:17-i;c.innerHTML='<b>'+n+'</b><small>'+(![0,4,9,14].includes(i)?'€ '+price(i):'')+'</small>'+ps.map((p,k)=>p.pos===i?['🔴','🔵','🟢','🟣'][k]:'').join(' ')+(owners[i]!==undefined?'<small>Eigenaar: '+ps[owners[i]].name+'</small>':'');b.appendChild(c)});let mid=document.createElement('div');mid.className='center';mid.innerHTML='<h2>WEST-VLAAMSE<br>MONOPOLY</h2><p>🎲 Vastgoedspel</p>';b.appendChild(mid);if(ps.length){document.getElementById('turn').textContent='Aan de beurt: '+ps[turn].name;document.getElementById('money').textContent=ps.map(p=>p.name+': €'+p.cash).join(' | ');document.getElementById('roll').disabled=done;document.getElementById('buy').disabled=!canBuy;document.getElementById('next').disabled=!done}}function start(){ps=Array.from({length:+document.getElementById('count').value},(_,i)=>({name:document.getElementById('p'+i).value,cash:1500,pos:0}));document.getElementById('setup').hidden=true;document.getElementById('game').hidden=false;draw()}function roll(){let p=ps[turn],d=2+Math.floor(Math.random()*6)+Math.floor(Math.random()*6);let x=p.pos+d;if(x>=16){p.cash+=200;log(p.name+' krijgt €200 voor START')}p.pos=x%16;done=true;canBuy=false;let i=p.pos;log(p.name+' gooit '+d+' en komt op '+locations[i]);if(i===14){p.pos=4;log('Naar de gevangenis!')}else if(i!==0&&i!==4&&i!==9){if(owners[i]===undefined){canBuy=p.cash>=price(i)}else if(owners[i]!==turn){let rent=Math.round(price(i)*.2);p.cash-=rent;ps[owners[i]].cash+=rent;log('Huur betaald: €'+rent)}}draw()}function buy(){let p=ps[turn],i=p.pos;if(!canBuy)return;p.cash-=price(i);owners[i]=turn;canBuy=false;log(p.name+' koopt '+locations[i]);draw()}function next(){turn=(turn+1)%ps.length;done=false;canBuy=false;draw()}draw();</script></html>
