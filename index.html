<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>West-Vlaamse Monopoly</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#102238;color:white;margin:0;padding:10px;overflow-x:hidden}main{max-width:850px;width:100%;min-width:0;margin:auto}h1{color:#ffd166}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:3px;width:100%;max-width:100%;aspect-ratio:1/1;overflow:hidden}.cell{background:#f4f5f8;color:#172337;border-radius:5px;min-width:0;min-height:0;padding:2px;font-size:clamp(7px,1.9vw,12px);overflow:hidden;overflow-wrap:anywhere;border-top:5px solid #e4a54c}.cell b{display:block}.center{grid-column:2/5;grid-row:2/5;min-width:0;display:grid;place-content:center;text-align:center;background:#1c3853;border-radius:8px;padding:5px}.center h2{font-size:clamp(15px,4vw,28px);overflow-wrap:anywhere}.center p{font-size:clamp(10px,3vw,16px)}button{padding:12px;border:0;border-radius:8px;background:#ffd166;margin:4px;font-weight:700}button:disabled{opacity:.4}.panel{background:#1c3853;border-radius:10px;padding:14px;margin:12px 0}input{padding:8px;width:min(100px,42%);margin:3px}#log{max-height:180px;overflow:auto}.cell .buildings{font-size:clamp(8px,2vw,14px)}.cell .owner{font-size:clamp(7px,1.8vw,11px)} @media(min-width:650px){.cell{padding:7px;font-size:13px;border-top-width:9px}}.bank{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:12px 0}.bank-item{background:#102238;padding:9px;border-radius:8px;font-size:13px;min-width:0;overflow-wrap:anywhere}.bank-item.current{outline:2px solid #ffd166}.property{padding:10px;border-radius:8px;background:#304862;margin-bottom:8px;font-size:13px}.cell .owner{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell .buildings{display:block;white-space:nowrap}.cell .pieces{display:block}.cell{position:relative}.cell .owner-dot{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:2px}.portfolio-player{padding:10px;background:#102238;border-radius:8px;margin:8px 0;font-size:14px}#game button{min-height:44px}small{display:block}</style><main><h1>🎲 West-Vlaamse Monopoly</h1><p>V5 • Eigendomsoverzicht, bank en verbeterde bediening • 2 tot 4 spelers op één toestel</p><div id="setup" class="panel">Spelers: <select id="count" onchange="names()"><option>2</option><option>3</option><option>4</option></select><div id="names"></div><button onclick="start()">Start spel</button></div><div id="game" hidden><div class="panel"><b id="turn"></b><div id="money" class="bank"></div><div id="property" class="property"></div><button id="roll" onclick="roll()">🎲 Gooien</button><button id="buy" onclick="buy()">🏠 Kopen</button><button id="build" onclick="build()">🔨 Bouw huis/hotel</button><button id="next" onclick="next()">Volgende beurt</button></div></div><div class="board" id="board"></div><div class="panel"><h3>🏘️ Eigendommen per speler</h3><div id="portfolio"></div></div><div class="panel" id="log">Welkom!</div></main><script>
const locations=['START','Kortrijk','Waregem','Roeselare','GEVANGENIS','Ieper','Brugge','Oostende','Knokke','GRATIS PARKEREN','Diksmuide','Menen','Tielt','Poperinge','GA NAAR GEVANGENIS','De Panne'];
const special=new Set([0,4,9,14]);
const cards=[['Je wint een wedstrijd! Ontvang €150.',150],['Een parkeerboete! Betaal €75.',-75],['Belastingteruggave! Ontvang €100.',100],['Herstellingswerken! Betaal €100.',-100],['Feestbonus! Ontvang €50.',50]];
let ps=[],turn=0,done=false,owners={},houses={},canBuy=false,gameOver=false;
const el=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function names(){el('names').innerHTML=Array.from({length:+el('count').value},(_,i)=>'<input id="p'+i+'" maxlength="20" value="Speler '+(i+1)+'">').join('')}
names();
function price(i){return 100+i*25}
function buildingCost(i){return Math.round(price(i)/2)}
function rent(i){return Math.round(price(i)*.2)*(1+(houses[i]||0)*2)}
function log(s){el('log').innerHTML='<p>'+esc(s)+'</p>'+el('log').innerHTML}
function alive(){return ps.filter(p=>!p.bankrupt)}
function check(){if(alive().length===1){gameOver=true;log('🏆 '+alive()[0].name+' wint het spel!')}}
function transfer(p,amount,to){p.cash-=amount;if(to)to.cash+=amount;if(p.cash<0){p.bankrupt=true;log(p.name+' is failliet!');Object.keys(owners).forEach(i=>{if(owners[i]===ps.indexOf(p)){delete owners[i];delete houses[i]}});check()}}
function draw(){
let b=el('board');b.innerHTML='';
locations.forEach((n,i)=>{let x=document.createElement('div');x.className='cell';x.style.gridColumn=i<5?i+1:i<9?5:i<13?13-i:1;x.style.gridRow=i<5?1:i<9?i-3:i<13?5:17-i;
x.innerHTML='<b>'+esc(n)+'</b><small>'+(special.has(i)?'':'€ '+price(i))+'</small><span class="buildings">'+(houses[i]===5?'🏨':'🏠'.repeat(houses[i]||0))+'</span><span class="owner">'+(owners[i]!==undefined?'👑 '+esc(ps[owners[i]].name):'')+'</span><div>'+ps.map((p,k)=>p.pos===i?['🔴','🔵','🟢','🟣'][k]:'').join('')+'</div>';b.appendChild(x)});
let mid=document.createElement('div');mid.className='center';mid.innerHTML='<h2>WEST-VLAAMSE<br>MONOPOLY</h2><p>🎲 Vastgoedspel V5</p>';b.appendChild(mid);
if(ps.length){let p=ps[turn];el('turn').textContent='Aan de beurt: '+p.name+(p.jail?' 🚔 gevangenis':'');el('money').innerHTML=ps.map((q,k)=>'<div class="bank-item '+(k===turn?'current':'')+'">'+['🔴','🔵','🟢','🟣'][k]+' <b>'+esc(q.name)+'</b><br>'+(q.bankrupt?'Failliet':'💶 € '+q.cash)+'</div>').join('');let owned=Object.keys(owners).filter(i=>owners[i]===turn).length;let spot=p.pos;el('property').textContent=special.has(spot)?'📍 '+locations[spot]+' • '+owned+' eigendommen': '📍 '+locations[spot]+' • '+(owners[spot]===undefined?'Te koop: €'+price(spot):owners[spot]===turn?'Jouw eigendom • bouwkost €'+buildingCost(spot):'Van '+ps[owners[spot]].name+' • huur €'+rent(spot));el('roll').disabled=done||gameOver;el('buy').disabled=!canBuy||gameOver;el('build').disabled=!done||gameOver||owners[p.pos]!==turn||(houses[p.pos]||0)>=5||p.cash<buildingCost(p.pos);el('next').disabled=!done||gameOver}el('portfolio').innerHTML=ps.map((p,k)=>'<div class="portfolio-player"><b>'+['🔴','🔵','🟢','🟣'][k]+' '+esc(p.name)+'</b><div>'+(Object.keys(owners).filter(i=>owners[i]===k).map(i=>esc(locations[i])+(houses[i]===5?' 🏨':houses[i]?' 🏠×'+houses[i]:'')).join(' · ')||'Nog geen eigendommen')+'</div></div>').join('')
}
function start(){ps=Array.from({length:+el('count').value},(_,i)=>({name:el('p'+i).value.trim()||'Speler '+(i+1),cash:1500,pos:0,jail:0,bankrupt:false}));turn=0;done=false;owners={};houses={};canBuy=false;gameOver=false;el('setup').hidden=true;el('game').hidden=false;el('log').innerHTML='';log('Het spel begint! Iedereen ontvangt €1500.');draw()}
function roll(){if(done||gameOver)return;let p=ps[turn];done=true;canBuy=false;let d1=1+Math.floor(Math.random()*6),d2=1+Math.floor(Math.random()*6);
if(p.jail){p.jail--;log(p.name+' slaat deze beurt over in de gevangenis.');draw();return}
let n=p.pos+d1+d2;if(n>=16){p.cash+=200;log(p.name+' ontvangt €200 voor het passeren van START.')}p.pos=n%16;let i=p.pos;log(p.name+' gooit '+d1+' + '+d2+' en komt op '+locations[i]+'.');
if(i===14){p.pos=4;p.jail=1;log('🚔 '+p.name+' gaat naar de gevangenis!')}
else if(i===9){let card=cards[Math.floor(Math.random()*cards.length)];log('🎴 '+card[0]);if(card[1]>=0)p.cash+=card[1];else transfer(p,-card[1])}
else if(!special.has(i)){if(owners[i]===undefined){canBuy=p.cash>=price(i);log('Deze stad kost €'+price(i)+'.')}else if(owners[i]!==turn){let amount=rent(i);transfer(p,amount,ps[owners[i]]);log(p.name+' betaalt €'+amount+' huur aan '+ps[owners[i]].name+'.')}}
draw()}
function buy(){let p=ps[turn],i=p.pos;if(!canBuy||owners[i]!==undefined||p.cash<price(i))return;p.cash-=price(i);owners[i]=turn;houses[i]=0;canBuy=false;log(p.name+' koopt '+locations[i]+' voor €'+price(i)+'.');draw()}
function build(){let p=ps[turn],i=p.pos,level=houses[i]||0,cost=buildingCost(i);if(!done||owners[i]!==turn||level>=5||p.cash<cost)return;p.cash-=cost;houses[i]=level+1;log(p.name+' bouwt '+(houses[i]===5?'een hotel':'huis '+houses[i])+' in '+locations[i]+' voor €'+cost+'.');draw()}
function next(){if(!done||gameOver)return;do{turn=(turn+1)%ps.length}while(ps[turn].bankrupt);done=false;canBuy=false;draw()}
draw();</script></html>
